  assemblies:
  - BelNytheraSeiche.WaveletMatrix
  namespace: BelNytheraSeiche.WaveletMatrix
  summary: >-
    Finds the longest substring(s) that appear in at least a specified number of texts.

    This method is optimized to only track the longest matches, avoiding the overhead of finding all matches.
  example: []
  syntax:
    content: public IEnumerable<LcpIndex.MultiSimilarityMatcher.MultiMatch> LongestMatch(int minTexts)
    parameters:
    - id: minTexts
      type: System.Int32
      description: The minimum number of texts the substring must appear in.
    return:
      type: System.Collections.Generic.IEnumerable{BelNytheraSeiche.WaveletMatrix.LcpIndex.MultiSimilarityMatcher.MultiMatch}
      description: >-
        An enumerable collection of <xref href="BelNytheraSeiche.WaveletMatrix.LcpIndex.MultiSimilarityMatcher.MultiMatch" data-throw-if-not-resolved="false"></xref> records for the longest common substring(s).

        Returns an empty collection if no match is found.
