    parameters:
    - id: minTexts
      type: System.Int32
      description: The minimum number of texts the substring must appear in.
    - id: minLength
      type: System.Int32
      description: The minimum length of the common substring.
    return:
      type: System.Collections.Generic.IEnumerable{BelNytheraSeiche.WaveletMatrix.LcpIndex.MultiSimilarityMatcher.MultiMatch}
      description: An enumerable collection of <xref href="BelNytheraSeiche.WaveletMatrix.LcpIndex.MultiSimilarityMatcher.MultiMatch" data-throw-if-not-resolved="false"></xref> records, with each record containing all occurrences.
